<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#252220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--paper:#EAE6DA;--card:#F6F3EA;--ink:#252220;--soft:#6b6459;--line:#d9d3c3;--accent:#2F5233;--income:#356b4b;--expense:#8a4b3e;--food:#C08A3E;--out:#6B4C7A;--invest:#2F5233;--grocery:#7A8C4A;--clothes:#4A6C8C;--shoes:#A64B2A;--misc:#8A8478}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}.app{max-width:480px;margin:auto;padding:0 16px 48px}.head{padding:22px 4px 18px}.eyebrow{font:11px 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}h1{font-family:Georgia,serif;font-size:30px;margin:4px 0 14px}.money-card{background:var(--ink);color:var(--card);border-radius:12px;padding:17px 18px;position:relative}.money-card:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;background:linear-gradient(135deg,var(--ink) 50%,transparent 50%) 0 0/8px 8px,linear-gradient(-135deg,var(--ink) 50%,transparent 50%) 0 0/8px 8px}.money-label{font-size:11px;color:#c9c4b6;font-family:'Courier New',monospace;text-transform:uppercase;letter-spacing:.06em}.money-amt{font:600 29px 'Courier New',monospace;margin:3px 0 13px}.money-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid #514d47;padding-top:12px}.money-grid .v{font:600 16px 'Courier New',monospace;margin-top:3px}.income-v{color:#b8d5bd}.expense-v{color:#e2bbb2}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:22px}.card h2{font-family:Georgia,serif;font-size:15px;margin:0 0 12px;color:var(--soft)}.switch{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:12px}.switch button{flex:1;border:0;background:transparent;border-radius:7px;padding:9px;font:600 12px 'Courier New',monospace;text-transform:uppercase;color:var(--soft)}.switch button.active{background:var(--ink);color:var(--card)}.amount-row{display:flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:6px 12px;margin-bottom:12px}.amount-row span{font:20px 'Courier New',monospace;color:var(--soft)}.amount-row input{border:0;background:transparent;outline:0;font:600 22px 'Courier New',monospace;color:var(--ink);width:100%;padding:8px 6px}.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:9px 13px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;cursor:pointer}.chip:active{transform:scale(.96)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}.note-toggle{font-size:12.5px;color:var(--soft);text-decoration:underline;cursor:pointer}.note-row{display:none;margin-top:10px}.note-row.open{display:block}.note-row input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--paper);outline:0}.primary{width:100%;border:0;background:var(--accent);color:white;border-radius:9px;padding:11px;margin-top:10px;font-weight:600}.tabs{display:flex;gap:4px;margin-top:26px;border-bottom:1px solid var(--line)}.tab{flex:1;text-align:center;padding:10px 4px;font:12px 'Courier New',monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}.view{margin-top:16px}.view-section{display:none}.view-section.active{display:block}.subbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.nav-btn{background:var(--card);border:1px solid var(--line);width:34px;height:34px;border-radius:8px;font-size:16px;display:flex;align-items:center;justify-content:center}.nav-title{font-family:Georgia,serif;font-weight:600;font-size:16px}.day-input{font:13px 'Courier New',monospace;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.stat .l{font-size:11px;color:var(--soft);text-transform:uppercase;font-family:'Courier New',monospace}.stat .n{font:600 17px 'Courier New',monospace;margin-top:5px}.total-line{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px 14px;border-bottom:1px dashed var(--line);margin-bottom:10px}.t-label{font-size:12.5px;color:var(--soft)}.t-amt{font:600 20px 'Courier New',monospace}.entry{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}.meta{flex:1;min-width:0}.cat-name{font-size:13.5px;font-weight:500}.note{font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.amt{font:600 14.5px 'Courier New',monospace}.positive{color:var(--income)}.negative{color:var(--expense)}.del{color:var(--soft);font-size:16px;padding:2px 6px;cursor:pointer}.day-group{margin-bottom:14px}.d-label{font:11px 'Courier New',monospace;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.empty{text-align:center;padding:30px 10px;color:var(--soft);font-size:13.5px}.chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}.chart-card h3{font:600 15px Georgia,serif;margin:0 0 12px}.chart-wrap{display:flex;align-items:center;gap:16px}.pie{width:145px;height:145px;border-radius:50%;flex:none;background:conic-gradient(var(--income) 0deg 180deg,var(--expense) 180deg 360deg);position:relative}.pie:after{content:"";position:absolute;inset:38px;background:var(--card);border-radius:50%}.legend{font-size:12px;line-height:1.9}.legend-row{display:flex;align-items:center;gap:7px}.legend strong{font-family:'Courier New',monospace}.backup-row{display:flex;gap:8px;margin-top:22px}.backup-btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px;font:600 11px 'Courier New',monospace;text-transform:uppercase;color:var(--ink)}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:20px;font:13px 'Courier New',monospace;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.show{opacity:1!important;transform:translateX(-50%) translateY(0)!important}
.edit-modal{display:none;position:fixed;inset:0;background:rgba(37,34,32,.42);z-index:20;align-items:flex-end;justify-content:center;padding:16px}.edit-modal.open{display:flex}.edit-sheet{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2)}.edit-sheet h2{font:600 18px Georgia,serif;margin:0 0 14px}.edit-field{margin:10px 0}.edit-field label{display:block;font:11px 'Courier New',monospace;text-transform:uppercase;color:var(--soft);margin-bottom:5px}.edit-field input,.edit-field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);font:14px Inter,system-ui,sans-serif;color:var(--ink);outline:0}.edit-actions{display:flex;gap:8px;margin-top:14px}.edit-actions button{flex:1;border-radius:9px;padding:11px;border:1px solid var(--line);font-weight:600}.edit-save{background:var(--accent);color:white;border-color:var(--accent)!important}.edit-delete{color:var(--expense);background:var(--card)}</style></head>
<body><div class="app">
<div class="head"><div class="eyebrow" id="today-label">—</div><h1>Ledger</h1><div class="money-card"><div class="money-label">Money left</div><div class="money-amt" id="balance">₹0</div><div class="money-grid"><div><div class="money-label">Income</div><div class="v income-v" id="all-income">₹0</div></div><div><div class="money-label">Expenses</div><div class="v expense-v" id="all-expenses">₹0</div></div></div></div></div>
<div class="card"><h2>Opening balance</h2><div class="amount-row"><span>₹</span><input type="number" inputmode="decimal" id="opening-input" placeholder="0"></div><button class="primary" id="opening-save">Save opening balance</button></div>
<div class="card"><h2 id="entry-title">Log an expense</h2><div class="switch"><button id="expense-mode" class="active">Expense</button><button id="income-mode">Income</button></div><div class="amount-row"><span>₹</span><input type="number" inputmode="decimal" id="amount-input" placeholder="0"></div><div class="chip-grid" id="chips"></div><span class="note-toggle" id="note-toggle">+ add a note</span><div class="note-row" id="note-row"><input type="text" id="note-input" maxlength="60" placeholder="e.g. Zomato, salary, freelance..."></div><button class="primary" id="add-btn">Add expense</button></div>
<div class="tabs"><div class="tab active" data-tab="overview">Overview</div><div class="tab" data-tab="category">Categories</div><div class="tab" data-tab="month">Month</div><div class="tab" data-tab="day">Day</div></div>
<div class="view">
<section class="view-section active" id="view-overview"><div class="summary"><div class="stat"><div class="l">This month in</div><div class="n positive" id="month-income">₹0</div></div><div class="stat"><div class="l">This month out</div><div class="n negative" id="month-expense">₹0</div></div></div><div class="chart-card"><h3>Money flow</h3><div class="chart-wrap"><div class="pie" id="flow-pie"></div><div class="legend"><div class="legend-row"><span class="dot" style="background:var(--income)"></span>Income <strong id="pie-income">₹0</strong></div><div class="legend-row"><span class="dot" style="background:var(--expense)"></span>Expenses <strong id="pie-expense">₹0</strong></div></div></div></div><div class="chart-card"><h3>Where your expenses go</h3><div id="expense-pie-wrap"></div></div><div class="backup-row"><button class="backup-btn" id="backup-btn">Backup</button><button class="backup-btn" id="restore-btn">Restore</button><input type="file" id="restore-file" accept="application/json" hidden></div></section>
<section class="view-section" id="view-category"><div class="chip-grid" id="cat-summary"></div><div class="total-line"><span class="t-label" id="cat-total-label">All expenses</span><span class="t-amt" id="cat-total-amt">₹0</span></div><div id="cat-list"></div></section>
<section class="view-section" id="view-month"><div class="subbar"><div class="nav-btn" id="month-prev">‹</div><div class="nav-title" id="month-label">—</div><div class="nav-btn" id="month-next">›</div></div><div class="summary"><div class="stat"><div class="l">Income</div><div class="n positive" id="month-tab-income">₹0</div></div><div class="stat"><div class="l">Expenses</div><div class="n negative" id="month-tab-expense">₹0</div></div></div><div id="month-list"></div></section>
<section class="view-section" id="view-day"><div class="subbar"><div class="nav-btn" id="day-prev">‹</div><input type="date" class="day-input" id="day-input"><div class="nav-btn" id="day-next">›</div></div><div class="total-line"><span class="t-label">Net for day</span><span class="t-amt" id="day-net">₹0</span></div><div id="day-list"></div></section>
</div></div><div class="edit-modal" id="edit-modal"><div class="edit-sheet"><h2 id="edit-title">Edit entry</h2><div class="edit-field"><label>Amount</label><input id="edit-amount" type="number" inputmode="decimal"></div><div class="edit-field" id="edit-category-field"><label>Category</label><select id="edit-category"></select></div><div class="edit-field"><label>Date</label><input id="edit-date" type="date"></div><div class="edit-field"><label>Note / source</label><input id="edit-note" type="text" maxlength="60"></div><div class="edit-actions"><button id="edit-cancel">Cancel</button><button class="edit-delete" id="edit-delete">Delete</button><button class="edit-save" id="edit-save">Save</button></div></div></div><div id="toast"></div>
<script>
const EXP_CATS=[{key:'food',label:'Food',color:'var(--food)'},{key:'out',label:'Going Out',color:'var(--out)'},{key:'invest',label:'Investment',color:'var(--invest)'},{key:'grocery',label:'Groceries',color:'var(--grocery)'},{key:'clothes',label:'Clothes',color:'var(--clothes)'},{key:'shoes',label:'Shoes',color:'var(--shoes)'},{key:'misc',label:'Misc',color:'var(--misc)'}];
const catMap=Object.fromEntries(EXP_CATS.map(c=>[c.key,c]));const KEY='ledger-money-v2';let state={opening:0,expenses:[],incomes:[]};let mode='expense';let monthCursor=new Date();monthCursor.setDate(1);let dayCursor=todayStr();
function todayStr(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN')}function mk(d){return d.slice(0,7)}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)state={opening:+x.opening||0,expenses:Array.isArray(x.expenses)?x.expenses:[],incomes:Array.isArray(x.incomes)?x.incomes:[]}}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1500)}
function renderModes(){document.getElementById('expense-mode').classList.toggle('active',mode==='expense');document.getElementById('income-mode').classList.toggle('active',mode==='income');document.getElementById('entry-title').textContent=mode==='expense'?'Log an expense':'Log an income';document.getElementById('add-btn').textContent=mode==='expense'?'Add expense':'Add income';document.getElementById('chips').innerHTML='';if(mode==='expense')EXP_CATS.forEach(c=>{let b=document.createElement('div');b.className='chip';b.innerHTML=`<span class="dot" style="background:${c.color}"></span>${c.label}`;b.onclick=()=>addEntry(c.key);document.getElementById('chips').appendChild(b)});else{let b=document.createElement('div');b.className='chip';b.innerHTML='<span class="dot" style="background:var(--income)"></span>Income source goes in note';document.getElementById('chips').appendChild(b)}}
function addEntry(cat){let val=parseFloat(document.getElementById('amount-input').value);if(!val||val<=0){document.getElementById('amount-input').focus();return}let note=document.getElementById('note-input').value.trim();let id=Date.now()+'-'+Math.random().toString(36).slice(2,7);if(mode==='expense')state.expenses.push({id,amount:val,category:cat,note,date:todayStr()});else state.incomes.push({id,amount:val,note:note||'Income',date:todayStr()});save();document.getElementById('amount-input').value='';document.getElementById('note-input').value='';document.getElementById('note-row').classList.remove('open');toast((mode==='expense'?'Added expense ':'Added income ')+fmt(val));renderAll()}
function totals(){let inc=state.incomes.reduce((s,e)=>s+e.amount,0),exp=state.expenses.reduce((s,e)=>s+e.amount,0);return{inc,exp,balance:state.opening+inc-exp}}
function renderHeader(){let n=new Date(),t=totals(),m=mk(todayStr()),mi=state.incomes.filter(e=>mk(e.date)===m).reduce((s,e)=>s+e.amount,0),me=state.expenses.filter(e=>mk(e.date)===m).reduce((s,e)=>s+e.amount,0);document.getElementById('today-label').textContent=n.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('balance').textContent=fmt(t.balance);document.getElementById('all-income').textContent=fmt(t.inc);document.getElementById('all-expenses').textContent=fmt(t.exp);document.getElementById('month-income').textContent=fmt(mi);document.getElementById('month-expense').textContent=fmt(me);document.getElementById('opening-input').value=state.opening||'';document.getElementById('pie-income').textContent=fmt(t.inc);document.getElementById('pie-expense').textContent=fmt(t.exp);let total=t.inc+t.exp,ip=total?Math.round(t.inc/total*360):180;document.getElementById('flow-pie').style.background=`conic-gradient(var(--income) 0deg ${ip}deg,var(--expense) ${ip}deg 360deg)`}
function allEntries(){return [...state.expenses.map(e=>({...e,type:'expense'})),...state.incomes.map(e=>({...e,type:'income'}))].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id))}
function row(e){let isI=e.type==='income',label=isI?'Income':catMap[e.category]?.label||'Expense';let r=document.createElement('div');r.className='entry';r.innerHTML=`<span class="dot" style="background:${isI?'var(--income)':catMap[e.category]?.color||'var(--expense)'}"></span><div class="meta"><div class="cat-name">${esc(label)}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}</div><div class="amt ${isI?'positive':'negative'}">${isI?'+':'−'}${fmt(e.amount).slice(1)}</div><div class="del">✎</div>`;r.onclick=()=>openEdit(e.type,e.id);return r}

let editType=null,editId=null;
function openEdit(type,id){editType=type;editId=id;let list=type==='income'?state.incomes:state.expenses;let e=list.find(x=>x.id===id);if(!e)return;document.getElementById('edit-title').textContent=type==='income'?'Edit income':'Edit expense';document.getElementById('edit-amount').value=e.amount;document.getElementById('edit-date').value=e.date;document.getElementById('edit-note').value=e.note||'';let cf=document.getElementById('edit-category-field');let sel=document.getElementById('edit-category');if(type==='income'){cf.style.display='none'}else{cf.style.display='block';sel.innerHTML=EXP_CATS.map(c=>`<option value="${c.key}">${c.label}</option>`).join('');sel.value=e.category}document.getElementById('edit-modal').classList.add('open')}
function closeEdit(){document.getElementById('edit-modal').classList.remove('open');editType=null;editId=null}
document.getElementById('edit-cancel').onclick=closeEdit;document.getElementById('edit-save').onclick=()=>{let e=(editType==='income'?state.incomes:state.expenses).find(x=>x.id===editId);if(!e)return;let amount=parseFloat(document.getElementById('edit-amount').value);let date=document.getElementById('edit-date').value;if(!amount||amount<=0||!date){toast('Enter a valid amount and date');return}e.amount=amount;e.date=date;e.note=document.getElementById('edit-note').value.trim();if(editType==='expense')e.category=document.getElementById('edit-category').value;save();closeEdit();renderAll();toast('Entry updated')};document.getElementById('edit-delete').onclick=()=>{if(!editId)return;if(!confirm('Delete this entry?'))return;if(editType==='income')state.incomes=state.incomes.filter(x=>x.id!==editId);else state.expenses=state.expenses.filter(x=>x.id!==editId);save();closeEdit();renderAll();toast('Entry deleted')};document.getElementById('edit-modal').onclick=e=>{if(e.target.id==='edit-modal')closeEdit()};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderOverview(){let t=totals(),by={};EXP_CATS.forEach(c=>by[c.key]=0);state.expenses.forEach(e=>by[e.category]=(by[e.category]||0)+e.amount);let data=EXP_CATS.filter(c=>by[c.key]>0);let wrap=document.getElementById('expense-pie-wrap');if(!data.length){wrap.innerHTML='<div class="empty">No expenses yet.</div>';return}let sum=data.reduce((s,c)=>s+by[c.key],0),angle=0,parts=[];data.forEach(c=>{let end=angle+by[c.key]/sum*360;parts.push(`${c.color} ${angle}deg ${end}deg`);angle=end});wrap.innerHTML=`<div class="chart-wrap"><div class="pie" style="background:conic-gradient(${parts.join(',')})"></div><div class="legend">${data.map(c=>`<div class="legend-row"><span class="dot" style="background:${c.color}"></span>${c.label} <strong>${fmt(by[c.key])}</strong></div>`).join('')}</div></div>`}
function renderCategory(){let w=document.getElementById('cat-summary');w.innerHTML='';let by={};EXP_CATS.forEach(c=>by[c.key]=0);state.expenses.forEach(e=>by[e.category]=(by[e.category]||0)+e.amount);EXP_CATS.forEach(c=>{let b=document.createElement('div');b.className='chip';b.innerHTML=`<span class="dot" style="background:${c.color}"></span>${c.label} <span style="font:12px 'Courier New',monospace;color:var(--soft)">${fmt(by[c.key])}</span>`;b.onclick=()=>{let list=state.expenses.filter(e=>e.category===c.key).map(e=>({...e,type:'expense'}));document.getElementById('cat-total-label').textContent=c.label;document.getElementById('cat-total-amt').textContent=fmt(by[c.key]);renderGrouped('cat-list',list)};w.appendChild(b)});document.getElementById('cat-total-label').textContent='All expenses';document.getElementById('cat-total-amt').textContent=fmt(state.expenses.reduce((s,e)=>s+e.amount,0));renderGrouped('cat-list',state.expenses.map(e=>({...e,type:'expense'})))}
function renderGrouped(id,list){let w=document.getElementById(id);w.innerHTML='';if(!list.length){w.innerHTML='<div class="empty">Nothing here yet.</div>';return}let by={};list.forEach(e=>(by[e.date]??=[]).push(e));Object.keys(by).sort().reverse().forEach(d=>{let g=document.createElement('div');g.className='day-group';let l=document.createElement('div');l.className='d-label';l.textContent=new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});g.appendChild(l);by[d].forEach(e=>g.appendChild(row(e)));w.appendChild(g)})}
function renderMonth(){let y=monthCursor.getFullYear(),m=monthCursor.getMonth(),key=y+'-'+String(m+1).padStart(2,'0'),es=state.expenses.filter(e=>mk(e.date)===key).map(e=>({...e,type:'expense'})),is=state.incomes.filter(e=>mk(e.date)===key).map(e=>({...e,type:'income'}));document.getElementById('month-label').textContent=monthCursor.toLocaleDateString('en-IN',{month:'long',year:'numeric'});document.getElementById('month-tab-income').textContent=fmt(is.reduce((s,e)=>s+e.amount,0));document.getElementById('month-tab-expense').textContent=fmt(es.reduce((s,e)=>s+e.amount,0));renderGrouped('month-list',[...es,...is].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)))}
function renderDay(){document.getElementById('day-input').value=dayCursor;let list=allEntries().filter(e=>e.date===dayCursor),net=list.reduce((s,e)=>s+(e.type==='income'?e.amount:-e.amount),0);document.getElementById('day-net').textContent=(net>=0?'+':'−')+fmt(Math.abs(net));let w=document.getElementById('day-list');w.innerHTML='';if(!list.length){w.innerHTML='<div class="empty">No money movement logged this day.</div>';return}list.forEach(e=>w.appendChild(row(e)))}
function renderAll(){renderHeader();renderOverview();renderCategory();renderMonth();renderDay()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view-section').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('view-'+t.dataset.tab).classList.add('active')});document.getElementById('expense-mode').onclick=()=>{mode='expense';renderModes()};document.getElementById('income-mode').onclick=()=>{mode='income';renderModes()};document.getElementById('add-btn').onclick=()=>addEntry(mode==='expense'?'misc':null);document.getElementById('note-toggle').onclick=()=>document.getElementById('note-row').classList.toggle('open');document.getElementById('opening-save').onclick=()=>{state.opening=parseFloat(document.getElementById('opening-input').value)||0;save();renderAll();toast('Opening balance saved')};document.getElementById('month-prev').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()-1);renderMonth()};document.getElementById('month-next').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()+1);renderMonth()};document.getElementById('day-input').onchange=e=>{dayCursor=e.target.value;renderDay()};function shiftDay(n){let d=new Date(dayCursor+'T00:00:00');d.setDate(d.getDate()+n);dayCursor=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');renderDay()}document.getElementById('day-prev').onclick=()=>shiftDay(-1);document.getElementById('day-next').onclick=()=>shiftDay(1);
document.getElementById('backup-btn').onclick=()=>{let payload={version:2,exportedAt:new Date().toISOString(),...state};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='ledger-backup-'+todayStr()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup saved')};document.getElementById('restore-btn').onclick=()=>document.getElementById('restore-file').click();document.getElementById('restore-file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.expenses)||!Array.isArray(x.incomes))throw 0;if(!confirm('Restore this backup? It will replace your current Ledger data.'))return;state={opening:+x.opening||0,expenses:x.expenses,incomes:x.incomes};save();renderAll();toast('Ledger restored')}catch(err){alert('That backup file is not valid.')}};r.readAsText(f);e.target.value=''};
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', {scope: './'}).catch(err => console.error('Offline setup failed:', err));
  });
}
load();renderModes();renderAll();
</script></body></html>
