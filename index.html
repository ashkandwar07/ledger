<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#252220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE6DA;
    --paper-card:#F6F3EA;
    --ink:#252220;
    --ink-soft:#6b6459;
    --line:#d9d3c3;
    --accent:#2F5233;
    --accent-soft:#e3e9df;

    --food:#C08A3E;
    --out:#6B4C7A;
    --invest:#2F5233;
    --grocery:#7A8C4A;
    --clothes:#4A6C8C;
    --shoes:#A64B2A;
    --misc:#8A8478;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:480px;margin:0 auto;padding:0 16px 40px;}

  /* Header / running ticker */
  .head{
    padding:22px 4px 20px;
    position:relative;
  }
  .head .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .head h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    margin:4px 0 14px;
    letter-spacing:-0.01em;
  }
  .ticker{
    background:var(--ink);
    color:var(--paper-card);
    border-radius:10px;
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    position:relative;
  }
  .ticker::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-7px;
    height:7px;
    background:
      linear-gradient(135deg, var(--ink) 50%, transparent 50%) 0 0/8px 8px,
      linear-gradient(-135deg, var(--ink) 50%, transparent 50%) 0 0/8px 8px;
    background-repeat:repeat-x;
  }
  .ticker .label{font-size:12px;color:#c9c4b6;font-family:'IBM Plex Mono',monospace;}
  .ticker .amt{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}

  /* Quick add */
  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-top:22px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--ink-soft);
  }
  .amount-row{
    display:flex;
    align-items:center;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:9px;
    padding:6px 12px;
    margin-bottom:12px;
  }
  .amount-row span{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--ink-soft);}
  .amount-row input{
    border:none;background:transparent;outline:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:22px;font-weight:600;color:var(--ink);
    width:100%;padding:8px 6px;
  }
  .amount-row.shake{animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:20px;
    padding:9px 14px;
    font-size:13.5px;
    font-weight:500;
    display:flex;align-items:center;gap:7px;
    cursor:pointer;
    color:var(--ink);
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .chip:active{transform:scale(.96);}

  .note-toggle{
    font-size:12.5px;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;
    display:inline-block;margin-top:2px;
  }
  .note-row{margin-top:10px;display:none;}
  .note-row.open{display:block;}
  .note-row input{
    width:100%;border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;font-family:'Inter',sans-serif;font-size:13.5px;
    background:var(--paper);outline:none;
  }

  /* Tabs */
  .tabs{
    display:flex;gap:4px;margin-top:26px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1;text-align:center;padding:10px 4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-soft);cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600;}

  .view{margin-top:16px;}
  .view-section{display:none;}
  .view-section.active{display:block;}

  .subbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .nav-btn{
    background:var(--paper-card);border:1px solid var(--line);
    width:34px;height:34px;border-radius:8px;
    font-size:16px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink);
  }
  .nav-title{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .day-input{
    font-family:'IBM Plex Mono',monospace;
    border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;background:var(--paper-card);
    font-size:13.5px;color:var(--ink);
  }

  .cat-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .cat-summary .chip{cursor:pointer;}
  .cat-summary .chip.selected{background:var(--ink);color:var(--paper-card);border-color:var(--ink);}
  .cat-summary .chip .amt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .cat-summary .chip.selected .amt{color:#c9c4b6;}

  .total-line{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:6px 2px 14px;border-bottom:1px dashed var(--line);margin-bottom:10px;
  }
  .total-line .t-label{font-size:12.5px;color:var(--ink-soft);}
  .total-line .t-amt{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}

  .day-group{margin-bottom:14px;}
  .day-group .d-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;
  }
  .entry{
    display:flex;align-items:center;gap:10px;
    padding:9px 4px;border-bottom:1px solid var(--line);
  }
  .entry .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .entry .meta{flex:1;min-width:0;}
  .entry .cat-name{font-size:13.5px;font-weight:500;}
  .entry .note{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry .amt{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600;}
  .entry .del{
    color:var(--ink-soft);font-size:16px;padding:2px 6px;cursor:pointer;
  }

  .empty{
    text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13.5px;
  }

  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper-card);
    padding:10px 18px;border-radius:20px;font-size:13px;
    font-family:'IBM Plex Mono',monospace;
    opacity:0;transition:opacity .25s, transform .25s;
    pointer-events:none;
    white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <div class="eyebrow" id="today-label">—</div>
    <h1>Ledger</h1>
    <div class="ticker">
      <div>
        <div class="label">This month</div>
        <div class="amt" id="month-total">₹0</div>
      </div>
      <div style="text-align:right">
        <div class="label">All time</div>
        <div class="amt" id="alltime-total" style="font-size:16px;">₹0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Log an expense</h2>
    <div class="amount-row" id="amount-row">
      <span>₹</span>
      <input type="number" inputmode="decimal" id="amount-input" placeholder="0" />
    </div>
    <div class="chip-grid" id="add-chips"></div>
    <span class="note-toggle" id="note-toggle">+ add a note</span>
    <div class="note-row" id="note-row">
      <input type="text" id="note-input" placeholder="e.g. Zomato, Nike sale..." maxlength="60" />
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="category">Category</div>
    <div class="tab" data-tab="month">Month</div>
    <div class="tab" data-tab="day">Day</div>
  </div>

  <div class="view">
    <div class="view-section active" id="view-category">
      <div class="cat-summary" id="cat-summary"></div>
      <div class="total-line">
        <span class="t-label" id="cat-total-label">All time</span>
        <span class="t-amt" id="cat-total-amt">₹0</span>
      </div>
      <div id="cat-list"></div>
    </div>

    <div class="view-section" id="view-month">
      <div class="subbar">
        <div class="nav-btn" id="month-prev">‹</div>
        <div class="nav-title" id="month-label">—</div>
        <div class="nav-btn" id="month-next">›</div>
      </div>
      <div class="cat-summary" id="month-cat-summary"></div>
      <div class="total-line">
        <span class="t-label">Total</span>
        <span class="t-amt" id="month-total-amt">₹0</span>
      </div>
      <div id="month-list"></div>
    </div>

    <div class="view-section" id="view-day">
      <div class="subbar">
        <div class="nav-btn" id="day-prev">‹</div>
        <input type="date" class="day-input" id="day-input" />
        <div class="nav-btn" id="day-next">›</div>
      </div>
      <div class="total-line">
        <span class="t-label">Total</span>
        <span class="t-amt" id="day-total-amt">₹0</span>
      </div>
      <div id="day-list"></div>
    </div>
  </div>

</div>
<div id="toast"></div>

<script>
const CATS = [
  {key:'food', label:'Food', color:'var(--food)'},
  {key:'out', label:'Going Out', color:'var(--out)'},
  {key:'invest', label:'Investment', color:'var(--invest)'},
  {key:'grocery', label:'Groceries', color:'var(--grocery)'},
  {key:'clothes', label:'Clothes', color:'var(--clothes)'},
  {key:'shoes', label:'Shoes', color:'var(--shoes)'},
  {key:'misc', label:'Misc', color:'var(--misc)'},
];
const catMap = Object.fromEntries(CATS.map(c=>[c.key,c]));
const STORAGE_KEY = 'ash-expenses-v1';

let expenses = [];
let catFilter = null; // for category tab
let monthCursor = new Date(); monthCursor.setDate(1);
let dayCursor = todayStr();

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(n){
  return '₹' + Math.round(n).toLocaleString('en-IN');
}
function monthKey(dateStr){ return dateStr.slice(0,7); }

async function loadExpenses(){
  try{
    const res = await window.storage.get('expenses', false);
    expenses = res ? JSON.parse(res.value) : [];
  }catch(e){
    expenses = [];
  }
}
async function saveExpenses(){
  try{
    await window.storage.set('expenses', JSON.stringify(expenses), false);
  }catch(e){
    console.error('save failed', e);
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1400);
}

// ---------- Quick add ----------
function renderAddChips(){
  const wrap = document.getElementById('add-chips');
  wrap.innerHTML = '';
  CATS.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    chip.onclick = () => logExpense(c.key);
    wrap.appendChild(chip);
  });
}

function logExpense(catKey){
  const input = document.getElementById('amount-input');
  const val = parseFloat(input.value);
  if(!val || val <= 0){
    const row = document.getElementById('amount-row');
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
    input.focus();
    return;
  }
  const note = document.getElementById('note-input').value.trim();
  expenses.push({
    id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
    amount: val,
    category: catKey,
    note: note,
    date: todayStr(),
  });
  saveExpenses();
  showToast(`Added ${fmt(val)} · ${catMap[catKey].label}`);
  input.value = '';
  document.getElementById('note-input').value = '';
  document.getElementById('note-row').classList.remove('open');
  renderAll();
}

document.getElementById('note-toggle').onclick = () => {
  document.getElementById('note-row').classList.toggle('open');
};

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view-section').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-'+tab.dataset.tab).classList.add('active');
  };
});

// ---------- Header ticker ----------
function renderHeader(){
  const now = new Date();
  document.getElementById('today-label').textContent =
    now.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const curMonthKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const monthTotal = expenses.filter(e=>monthKey(e.date)===curMonthKey).reduce((s,e)=>s+e.amount,0);
  const allTotal = expenses.reduce((s,e)=>s+e.amount,0);
  document.getElementById('month-total').textContent = fmt(monthTotal);
  document.getElementById('alltime-total').textContent = fmt(allTotal);
}

// ---------- Category tab ----------
function renderCategoryTab(){
  const wrap = document.getElementById('cat-summary');
  wrap.innerHTML = '';
  const totalsByCat = {};
  CATS.forEach(c=>totalsByCat[c.key]=0);
  expenses.forEach(e=>{ totalsByCat[e.category] = (totalsByCat[e.category]||0) + e.amount; });

  CATS.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (catFilter===c.key ? ' selected':'');
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label} <span class="amt">${fmt(totalsByCat[c.key])}</span>`;
    chip.onclick = () => { catFilter = (catFilter===c.key ? null : c.key); renderCategoryTab(); };
    wrap.appendChild(chip);
  });

  const list = catFilter ? expenses.filter(e=>e.category===catFilter) : expenses.slice();
  list.sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
  const total = list.reduce((s,e)=>s+e.amount,0);
  document.getElementById('cat-total-label').textContent = catFilter ? catMap[catFilter].label + ' · all time' : 'All time · all categories';
  document.getElementById('cat-total-amt').textContent = fmt(total);

  renderEntryListGroupedByDate('cat-list', list);
}

// ---------- Month tab ----------
function renderMonthTab(){
  const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
  const mk = y+'-'+String(m+1).padStart(2,'0');
  document.getElementById('month-label').textContent = monthCursor.toLocaleDateString('en-IN',{month:'long', year:'numeric'});

  const list = expenses.filter(e=>monthKey(e.date)===mk);
  list.sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
  const total = list.reduce((s,e)=>s+e.amount,0);
  document.getElementById('month-total-amt').textContent = fmt(total);

  const wrap = document.getElementById('month-cat-summary');
  wrap.innerHTML = '';
  const totalsByCat = {};
  list.forEach(e=>{ totalsByCat[e.category] = (totalsByCat[e.category]||0) + e.amount; });
  CATS.filter(c=>totalsByCat[c.key]).forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.style.pointerEvents = 'none';
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label} <span class="amt">${fmt(totalsByCat[c.key])}</span>`;
    wrap.appendChild(chip);
  });

  renderEntryListGroupedByDate('month-list', list);
}
document.getElementById('month-prev').onclick = () => { monthCursor.setMonth(monthCursor.getMonth()-1); renderMonthTab(); };
document.getElementById('month-next').onclick = () => { monthCursor.setMonth(monthCursor.getMonth()+1); renderMonthTab(); };

// ---------- Day tab ----------
function renderDayTab(){
  document.getElementById('day-input').value = dayCursor;
  const list = expenses.filter(e=>e.date===dayCursor);
  list.sort((a,b)=> b.id.localeCompare(a.id));
  const total = list.reduce((s,e)=>s+e.amount,0);
  document.getElementById('day-total-amt').textContent = fmt(total);
  renderEntryListFlat('day-list', list);
}
document.getElementById('day-input').onchange = (e) => { dayCursor = e.target.value; renderDayTab(); };
document.getElementById('day-prev').onclick = () => { shiftDay(-1); };
document.getElementById('day-next').onclick = () => { shiftDay(1); };
function shiftDay(delta){
  const d = new Date(dayCursor+'T00:00:00');
  d.setDate(d.getDate()+delta);
  dayCursor = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  renderDayTab();
}

// ---------- Shared entry rendering ----------
function entryRow(e){
  const c = catMap[e.category];
  const row = document.createElement('div');
  row.className = 'entry';
  row.innerHTML = `
    <span class="dot" style="background:${c.color}"></span>
    <div class="meta">
      <div class="cat-name">${c.label}</div>
      ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ''}
    </div>
    <div class="amt">${fmt(e.amount)}</div>
    <div class="del" data-id="${e.id}">×</div>
  `;
  row.querySelector('.del').onclick = () => deleteEntry(e.id);
  return row;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function deleteEntry(id){
  expenses = expenses.filter(e=>e.id!==id);
  saveExpenses();
  renderAll();
}
function renderEntryListGroupedByDate(containerId, list){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  if(list.length === 0){
    wrap.innerHTML = '<div class="empty">Nothing here yet.</div>';
    return;
  }
  const byDate = {};
  list.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
  Object.keys(byDate).sort().reverse().forEach(date=>{
    const group = document.createElement('div');
    group.className = 'day-group';
    const label = document.createElement('div');
    label.className = 'd-label';
    label.textContent = new Date(date+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short', day:'numeric', month:'short'});
    group.appendChild(label);
    byDate[date].forEach(e=>group.appendChild(entryRow(e)));
    wrap.appendChild(group);
  });
}
function renderEntryListFlat(containerId, list){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  if(list.length === 0){
    wrap.innerHTML = '<div class="empty">No expenses logged this day.</div>';
    return;
  }
  list.forEach(e=>wrap.appendChild(entryRow(e)));
}

function renderAll(){
  renderHeader();
  renderCategoryTab();
  renderMonthTab();
  renderDayTab();
}

(function init(){
  renderAddChips();
  loadExpenses();
  renderAll();
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.error));
  }
})();
</script>
</body>
</html>
